version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: NUnit
        update-types:
          - version-update:semver-major
      - dependency-name: NUnit3TestAdapter
        update-types:
          - version-update:semver-major
      - dependency-name: "AutoFixture*"
        update-types:
          - version-update:semver-major
      - dependency-name: Moq
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
