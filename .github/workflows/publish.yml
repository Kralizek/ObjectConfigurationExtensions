name: Publish

on:
  workflow_dispatch:
    inputs:
      release_channel:
        description: Prerelease channel to create, or none for a manual package build
        type: choice
        required: true
        default: none
        options:
          - none
          - alpha
          - beta
          - rc
      dry_run:
        description: Validate the selected release without publishing packages or creating a release
        type: boolean
        required: false
        default: false
  release:
    types: [published]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CONFIGURATION: Release
  MinVerDefaultPreReleaseIdentifiers: preview

jobs:
  publish:
    name: Validate, pack, and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Validate manual release source
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run && github.ref != 'refs/heads/master'
        run: |
          echo "Manual releases must be dispatched from master."
          exit 1

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine minimum version
        if: github.event_name == 'workflow_dispatch' && inputs.release_channel != 'none'
        id: minimum-version
        shell: bash
        run: |
          set -euo pipefail

          minimum_major_minor=$(sed -n 's:.*<MinVerMinimumMajorMinor>\([^<]*\)</MinVerMinimumMajorMinor>.*:\1:p' eng/Package.props | head -n 1)

          if [[ ! "$minimum_major_minor" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Could not determine a valid MinVerMinimumMajorMinor from eng/Package.props."
            exit 1
          fi

          echo "version=${minimum_major_minor}.0" >> "$GITHUB_OUTPUT"

      - name: Determine prerelease version
        if: github.event_name == 'workflow_dispatch' && inputs.release_channel != 'none'
        id: prerelease-version
        uses: Kralizek/github-actions/actions/calculate-next-version@v0.4
        with:
          bump: minor
          channel: ${{ inputs.release_channel }}
          minimum-version: ${{ steps.minimum-version.outputs.version }}

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        env:
          MinVerVersionOverride: ${{ steps.prerelease-version.outputs.version }}
        run: dotnet restore

      - name: Verify formatting
        env:
          MinVerVersionOverride: ${{ steps.prerelease-version.outputs.version }}
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        env:
          MinVerVersionOverride: ${{ steps.prerelease-version.outputs.version }}
        run: dotnet build --configuration $CONFIGURATION --no-restore --warnaserror

      - name: Test
        env:
          MinVerVersionOverride: ${{ steps.prerelease-version.outputs.version }}
        run: dotnet test --configuration $CONFIGURATION --no-build --logger GitHubActions

      - name: Pack
        env:
          MinVerVersionOverride: ${{ steps.prerelease-version.outputs.version }}
        run: dotnet pack --configuration $CONFIGURATION --no-build --output ./artifacts/packages

      - name: Read package version
        shell: bash
        run: |
          set -euo pipefail
          package=$(ls ./artifacts/packages/Kralizek.Extensions.Configuration.Objects.*.nupkg | head -n 1)
          nuspec=$(unzip -p "$package" '*.nuspec')
          package_version=$(printf '%s\n' "$nuspec" | sed -n 's:.*<version>\(.*\)</version>.*:\1:p' | head -n 1)
          echo "PACKAGE_VERSION=$package_version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$package_version" >> "$GITHUB_ENV"

      - name: Validate symbol package
        shell: bash
        run: |
          set -euo pipefail
          symbol_package=$(ls ./artifacts/packages/Kralizek.Extensions.Configuration.Objects.*.snupkg | head -n 1)

          if ! unzip -Z1 "$symbol_package" | grep -qE '\.pdb$'; then
            echo "Symbol package $symbol_package does not contain any PDB files."
            exit 1
          fi

      - name: Validate GitHub release metadata
        if: github.event_name == 'release'
        id: validate-release
        uses: Kralizek/github-actions/actions/validate-release@v0.3
        with:
          tag: ${{ github.event.release.tag_name }}
          prerelease: ${{ github.event.release.prerelease }}

      - name: Validate release package version
        if: github.event_name == 'release'
        env:
          RELEASE_VERSION: ${{ steps.validate-release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$RELEASE_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Release tag version $RELEASE_VERSION does not match packed version $PACKAGE_VERSION."
            exit 1
          fi

      - name: Upload packages as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: |
            ./artifacts/packages/*.nupkg
            ./artifacts/packages/*.snupkg
          if-no-files-found: error

      - name: Dry-run release summary
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: |
          echo "Dry run: no packages or GitHub release will be published."
          echo "Release channel: ${{ inputs.release_channel }}"
          echo "Package version: $PACKAGE_VERSION"

      - name: Ensure GitHub prerelease exists
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run && inputs.release_channel != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES_START_TAG: ${{ steps.prerelease-version.outputs['release-notes-start-tag'] }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "GitHub prerelease $RELEASE_TAG already exists."
          else
            args=("$RELEASE_TAG" --repo "${{ github.repository }}" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes --prerelease)
            if [[ -n "$RELEASE_NOTES_START_TAG" ]]; then
              args+=(--notes-start-tag "$RELEASE_NOTES_START_TAG")
            fi
            gh release create "${args[@]}"
          fi

      - name: Configure GitHub Packages source
        if: github.event_name == 'release' || !inputs.dry_run
        run: >-
          dotnet nuget add source
          "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --name github
          --username "${{ github.actor }}"
          --password "${{ github.token }}"
          --store-password-in-clear-text

      - name: Publish to GitHub Packages
        if: github.event_name == 'release' || !inputs.dry_run
        run: >-
          dotnet nuget push
          "./artifacts/packages/*.nupkg"
          --source github
          --api-key "${{ github.token }}"
          --skip-duplicate

      - name: Log in to NuGet.org
        if: >-
          (github.event_name == 'release' && !contains(github.event.release.tag_name, '-alpha.')) ||
          (github.event_name == 'workflow_dispatch' && !inputs.dry_run && (inputs.release_channel == 'beta' || inputs.release_channel == 'rc'))
        id: nuget-login
        uses: nuget/login@8d196754b4036150537f80ac539e15c2f1028841
        with:
          user: Kralizek

      - name: Publish to NuGet.org
        if: >-
          (github.event_name == 'release' && !contains(github.event.release.tag_name, '-alpha.')) ||
          (github.event_name == 'workflow_dispatch' && !inputs.dry_run && (inputs.release_channel == 'beta' || inputs.release_channel == 'rc'))
        run: >-
          dotnet nuget push
          "./artifacts/packages/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --skip-duplicate

      - name: Upload packages to GitHub Release
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run && inputs.release_channel != 'none')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "$RELEASE_TAG"
          ./artifacts/packages/*.nupkg
          ./artifacts/packages/*.snupkg
          --repo "${{ github.repository }}"
          --clobber
